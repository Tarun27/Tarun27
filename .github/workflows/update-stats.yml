name: Update profile stats

on:
  schedule:
    # 02:17 UTC daily — off-peak, and off the hour so it is not queued behind
    # every other cron job on GitHub.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Render and push
        env:
          # The default GITHUB_TOKEN cannot see private repositories, which is
          # the entire point of this workflow. STATS_TOKEN is a PAT.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A push can be rejected because someone committed to main while this
          # run was working. Rebasing the generated commit would be wrong — it
          # was rendered against the old README and would carry stale
          # hand-written sections back. So reset onto the newest main and render
          # again. The script is idempotent and the API calls are cheap.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            python scripts/update_stats.py

            if git diff --quiet -- README.md; then
              echo "README already current; nothing to commit."
              exit 0
            fi

            git add README.md
            git commit --quiet -m "chore: refresh profile stats"

            if git push --quiet origin HEAD:main; then
              echo "pushed on attempt ${attempt}."
              exit 0
            fi
            echo "push rejected — main moved. Re-rendering onto it."
            sleep $((attempt * 5))
          done

          echo "could not push after 3 attempts" >&2
          exit 1
